name: VPNX7 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vpnx7-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Compile Python
        run: python -m compileall -q app scripts

      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Install shell test tools
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck jq unzip iproute2

      - name: Shellcheck
        run: shellcheck -e SC1090,SC1091,SC2015 scripts/*.sh

      - name: Legacy schema migration self-test
        run: python scripts/migration-selftest.py

      - name: Control-plane self-test
        run: python scripts/selftest.py

      - name: SQLite backup round-trip self-test
        run: python scripts/backup-selftest.py

      - name: SQLite restore smoke test
        run: sudo bash scripts/restore-selftest.sh

      - name: Xray node runtime self-test
        if: matrix.python-version == '3.12'
        run: sudo bash scripts/node-runtime-selftest.sh

  promote-stable:
    name: Promote verified main to stable
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward stable branch
        run: |
          git fetch origin stable:refs/remotes/origin/stable || true
          if git show-ref --verify --quiet refs/remotes/origin/stable; then
            git merge-base --is-ancestor refs/remotes/origin/stable HEAD
          fi
          git push origin HEAD:refs/heads/stable
