name: VPNX7 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app scripts

      - name: Validate shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck -e SC1090,SC1091,SC2015 scripts/*.sh

      - name: Legacy schema migration self-test
        run: python scripts/migration-selftest.py

      - name: Control-plane self-test
        run: python scripts/selftest.py
